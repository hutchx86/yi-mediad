name: overlay

# Builds the mediad SD-card overlay (dist/) and attaches it to a GitHub release,
# so a user with an existing yi-protect install can just download and install it.
# Manual, or on a v* tag: Actions tab, or
#   gh workflow run overlay.yml -f tag=v0.1.0

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create/update (e.g. v0.1.0)"
        required: true
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      # Checkout into the sibling layout the Makefile/package.sh expect:
      # sisters/yi-mediad/yi-mediad-git + sisters/freewinner/freewinner-git.
      - uses: actions/checkout@v4
        with:
          path: sisters/yi-mediad/yi-mediad-git

      - name: Checkout freewinner (clean-room ISP/codec it builds against)
        run: |
          git clone --depth 1 \
            https://github.com/hutchx86/freewinner \
            sisters/freewinner/freewinner-git

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake wget curl patch python3

      # build.sh fetches the pinned cross-toolchain, the V831 SDK, FAAC and the
      # RTOS ISP archive and builds a link-time libasound; package.sh builds the
      # deploy binary and assembles dist/. Nothing vendor is committed.
      - name: Build overlay
        run: |
          cd sisters/yi-mediad/yi-mediad-git
          ./build.sh
          ./package.sh

      - name: Package archive
        run: |
          REV=$(git -C sisters/yi-mediad/yi-mediad-git rev-parse --short HEAD)
          TAG="${{ inputs.tag }}"; [ -n "$TAG" ] || TAG="${GITHUB_REF_NAME}"
          tar czf "mediad-overlay-$REV.tar.gz" -C sisters/yi-mediad/yi-mediad-git/dist .
          sha256sum "mediad-overlay-$REV.tar.gz" > SHA256SUMS
          echo "REV=$REV" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: mediad overlay ${{ env.REV }}
          files: |
            mediad-overlay-${{ env.REV }}.tar.gz
            SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: mediad-overlay
          path: mediad-overlay-*.tar.gz
