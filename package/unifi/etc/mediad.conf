# mediad configuration (key=value). Optional: mediad uses built-in defaults
# (which match stock rmm) if this file is absent. Override the path with
# MEDIAD_CONF. Applied at boot and re-applied live on change.
#
# Picture controls (0..100 levels, 50 = neutral) can also be set at runtime over
# the control socket (/tmp/mediad_ctl.sock, via `mediad_ctl` or Protect).
#
# PINNING: any key set here is PINNED - Protect's connect-time re-assert is
# ACKed but ignored, so the value below wins. Protect re-sends its own defaults
# for some fields on every connect (e.g. enable3dnr=1, denoise=50), which would
# otherwise silently overwrite this file. To set a value at boot WITHOUT pinning
# it (Protect may change it later), write `pin_<key>=<value>` instead.
#
# Examples (uncomment to pin a value):
# brightness=50
# contrast=50
# saturation=50
# hue=50
# sharpness=50
# gamma=50
#
# 3D/temporal denoise (3DNR). DEFAULT OFF: stock's temporal denoise leaves a
# low-light motion "shadow"/ghosting that follows a moving subject, so both it
# and the 3DNR module default to 0. `denoise` is the 0..100 register ramp (0 =
# off); `tdf` is the 3DNR module enable (Protect's enable3dnr). Protect
# re-asserts enable3dnr=1 and denoise=50 on connect, so to keep them off across
# a Protect connect they must be pinned here (uncommented). They are pinned
# below at 0 to make the no-ghost default stick.
denoise=0
tdf=0
#
# Encoder (HIGH channel):
# bitrate=2800000         # bps, clamped 48000..4000000
#
# Night vision (nightvision: 0 day, 1 night, 2 auto):
# nightvision=2
# night_lux=5             # auto-switch threshold (AE lux)
# ir_led=0                # 0..100
#
# HDR/WDR and PLTM: 1 = vendor stock.
# pltm=1
# wdr=0                   # strength, 0 = vendor stock
